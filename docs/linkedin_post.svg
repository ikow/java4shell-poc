<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="redglow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="628" fill="url(#bg)"/>
  <rect width="1200" height="628" fill="url(#redglow)"/>

  <!-- Subtle grid -->
  <g opacity="0.03" stroke="#f0f6fc" stroke-width="0.5" fill="none">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="628"/>
    <line x1="400" y1="0" x2="400" y2="628"/>
    <line x1="600" y1="0" x2="600" y2="628"/>
    <line x1="800" y1="0" x2="800" y2="628"/>
    <line x1="1000" y1="0" x2="1000" y2="628"/>
  </g>

  <!-- Terminal header bar -->
  <rect x="0" y="0" width="1200" height="52" fill="#161b22" opacity="0.8"/>
  <circle cx="28" cy="26" r="6" fill="#ef4444"/>
  <circle cx="50" cy="26" r="6" fill="#f97316"/>
  <circle cx="72" cy="26" r="6" fill="#16a765"/>
  <text x="110" y="31" font-family="'SF Mono', monospace, Courier" font-size="14" fill="#484f58">security-advisory.md — CVE-2026-114938</text>

  <!-- CVSS Badge -->
  <rect x="80" y="78" width="280" height="48" rx="24" fill="#21262d" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="116" cy="102" r="18" fill="#ef4444"/>
  <text x="116" y="108" text-anchor="middle" font-family="'SF Mono', monospace, Courier" font-size="16" font-weight="bold" fill="#fff">!</text>
  <text x="148" y="96" font-family="'SF Mono', monospace, Courier" font-size="13" fill="#8b949e">CVSS 4.0</text>
  <text x="148" y="114" font-family="'SF Mono', monospace, Courier" font-size="18" font-weight="bold" fill="#ef4444">9.2 CRITICAL</text>

  <!-- RCE badge -->
  <rect x="400" y="78" width="320" height="48" rx="24" fill="#21262d" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="108" text-anchor="middle" font-family="'SF Mono', monospace, Courier" font-size="15" fill="#f97316">Pre-Auth Remote Code Execution</text>

  <!-- AVX-512 badge -->
  <rect x="760" y="78" width="240" height="48" rx="24" fill="#21262d" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="880" y="108" text-anchor="middle" font-family="'SF Mono', monospace, Courier" font-size="15" fill="#3b82f6">AVX-512 VBMI Gated</text>

  <!-- Vulnerability details block -->
  <g font-family="'SF Mono', monospace, Courier" font-size="14" fill="#8b949e">
    <text x="80" y="165">Component:  hotspot/compiler — AVX-512 VBMI Base64 intrinsic</text>
    <text x="80" y="190">Attack:     Network / No Auth / Low Complexity</text>
    <text x="80" y="215">Impact:     Integer Underflow → 62-byte Heap Overflow → RCE</text>
    <text x="80" y="240">Trigger:    Authorization: Basic "A"×64 + "=" (65 bytes)</text>
  </g>

  <!-- Center: The overflow visualization -->
  <rect x="80" y="270" width="1040" height="90" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Buffer diagram -->
  <text x="100" y="295" font-family="'SF Mono', monospace, Courier" font-size="12" fill="#484f58">heap buffer (50 bytes)</text>
  <text x="560" y="295" font-family="'SF Mono', monospace, Courier" font-size="12" fill="#484f58">overflow (62 bytes)</text>

  <!-- Buffer box -->
  <rect x="100" y="305" width="380" height="36" rx="4" fill="#1a3a1a" stroke="#16a765" stroke-width="1.5"/>
  <text x="290" y="328" text-anchor="middle" font-family="'SF Mono', monospace, Courier" font-size="13" fill="#16a765">[ valid decoded data : 0-49 ]</text>

  <!-- Overflow box -->
  <rect x="480" y="305" width="620" height="36" rx="4" fill="#3a1a1a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="790" y="328" text-anchor="middle" font-family="'SF Mono', monospace, Courier" font-size="13" fill="#ef4444">[ 9a 69 a6 9a 69 a6 9a 69 a6 ... ]  VMOVDQU8 writes 64 bytes</text>

  <!-- Arrow showing overflow direction -->
  <text x="470" y="328" font-family="'SF Mono', monospace, Courier" font-size="18" fill="#f97316">→</text>

  <!-- Downstream targets confirmed -->
  <text x="80" y="400" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold" fill="#f0f6fc">Downstream targets tested (default configs, pre-auth):</text>

  <!-- Target boxes -->
  <rect x="80" y="418" width="250" height="44" rx="8" fill="#21262d" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="105" cy="440" r="8" fill="#ef4444"/>
  <text x="122" y="445" font-family="'SF Mono', monospace, Courier" font-size="14" fill="#f0f6fc">Keycloak 26.0</text>
  <text x="290" y="445" text-anchor="end" font-family="'SF Mono', monospace, Courier" font-size="11" fill="#ef4444">FIRED</text>

  <rect x="350" y="418" width="250" height="44" rx="8" fill="#21262d" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="375" cy="440" r="8" fill="#ef4444"/>
  <text x="392" y="445" font-family="'SF Mono', monospace, Courier" font-size="14" fill="#f0f6fc">Jenkins LTS</text>
  <text x="560" y="445" text-anchor="end" font-family="'SF Mono', monospace, Courier" font-size="11" fill="#ef4444">FIRED</text>

  <rect x="620" y="418" width="250" height="44" rx="8" fill="#21262d" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="645" cy="440" r="8" fill="#ef4444"/>
  <text x="662" y="445" font-family="'SF Mono', monospace, Courier" font-size="14" fill="#f0f6fc">Elasticsearch 8.17</text>
  <text x="830" y="445" text-anchor="end" font-family="'SF Mono', monospace, Courier" font-size="11" fill="#ef4444">FIRED</text>

  <rect x="890" y="418" width="210" height="44" rx="8" fill="#21262d" stroke="#f97316" stroke-width="1.5"/>
  <circle cx="915" cy="440" r="8" fill="#f97316"/>
  <text x="932" y="445" font-family="'SF Mono', monospace, Courier" font-size="14" fill="#f0f6fc">Spring Boot 3.4</text>
  <text x="1060" y="445" text-anchor="end" font-family="'SF Mono', monospace, Courier" font-size="11" fill="#f97316">VULN</text>

  <!-- Affected versions -->
  <text x="80" y="502" font-family="'SF Mono', monospace, Courier" font-size="13" fill="#8b949e">Affected:  JDK 17.0.6 → 17.0.21  |  All JDK 21/25/27 pre-.1 builds</text>
  <text x="80" y="524" font-family="'SF Mono', monospace, Courier" font-size="13" fill="#8b949e">Hardware:  Intel Ice Lake+, AMD Zen 4+  (GCP c3/c4, AWS m7i, Azure Dv5)</text>
  <text x="80" y="546" font-family="'SF Mono', monospace, Courier" font-size="13" fill="#16a765">Fix:       3 lines of assembly — length &lt; 4 guard before BZHI underflow</text>

  <!-- Bottom tagline -->
  <rect x="0" y="576" width="1200" height="52" fill="#161b22" opacity="0.6"/>
  <text x="80" y="608" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" fill="#f0f6fc" font-weight="bold">Java's memory safety ends where the JIT compiler begins.</text>
  <text x="1120" y="608" text-anchor="end" font-family="'SF Mono', monospace, Courier" font-size="13" fill="#484f58">@ikow · java4shell</text>
</svg>
